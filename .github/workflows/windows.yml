name: Windows Build

# Slim Windows CI for bramburn/CloudCompare.
# Mirrors the local build at C:\dev\CloudCompare (18 self-contained plugins,
# no LAS/E57/PCL — those need vcpkg and are out of scope for first-pass CI).
# Upstream's full plugin set is tested in CloudCompare/CloudCompare's own CI.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Cancel in-progress runs when a new commit lands on the same branch.
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows MSVC 2022 / Qt 6.8 / Ninja
    runs-on: windows-latest
    timeout-minutes: 60

    env:
      # Pin to the same versions as the local build.
      QT_VERSION: '6.8.3'
      CMAKE_GENERATOR: Ninja
      BUILD_TYPE: Release

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up MSVC 2022
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64

      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          # Qt 6.8 base desktop install already includes Core/Gui/Widgets/Network/
          # OpenGL/Svg — qtsvg and qttools were moved out of the modules index
          # for 6.8. Adding qtimageformats for TIFF/JPEG support.
          modules: 'qtimageformats'
          cache: true

      - name: Pin CMake to 4.3.0 (hidapi submodule caps at 4.3)
        # Use choco instead of lukka/get-cmake — the latter fails on the
        # current Windows runner with EACCES on WindowsApps\python.EXE.
        shell: pwsh
        run: |
          choco install cmake --version=4.3.0 -y --no-progress
          # Re-read PATH so subsequent steps see the choco install
          $env:Path = [Environment]::GetEnvironmentVariable("Path", "Machine") + ";" + [Environment]::GetEnvironmentVariable("Path", "User")
          cmake --version

      - name: Configure (Ninja, Release, 18 self-contained plugins)
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja --fresh `
            -DCMAKE_BUILD_TYPE=$env:BUILD_TYPE `
            -DCMAKE_PREFIX_PATH="$env:Qt6_DIR" `
            -DCMAKE_MAKE_PROGRAM=ninja `
            -DPLUGIN_IO_QCORE=ON `
            -DPLUGIN_GL_QEDL=ON `
            -DPLUGIN_GL_QSSAO=ON `
            -DPLUGIN_STANDARD_QANIMATION=ON `
            -DPLUGIN_STANDARD_QBROOM=ON `
            -DPLUGIN_STANDARD_QCSF=ON `
            -DPLUGIN_STANDARD_QM3C2=ON `
            -DPLUGIN_STANDARD_QPOISSON_RECON=ON `
            -DPLUGIN_STANDARD_QRANSAC_SD=ON `
            -DPLUGIN_STANDARD_QSRA=ON `
            -DPLUGIN_STANDARD_QHPR=ON `
            -DPLUGIN_STANDARD_QPCV=ON `
            -DPLUGIN_STANDARD_QCOLORIMETRIC_SEGMENTER=ON `
            -DPLUGIN_STANDARD_QMPLANE=ON `
            -DPLUGIN_STANDARD_QVOXFALL=ON `
            -DPLUGIN_STANDARD_QCOMPASS=ON `
            -DPLUGIN_STANDARD_QCANUPO=ON `
            -DPLUGIN_STANDARD_3DFIN=ON

      - name: Build
        shell: pwsh
        run: cmake --build build --config $env:BUILD_TYPE --parallel 4

      - name: Check formatting
        shell: pwsh
        run: cmake --build build --target check-format

      - name: Install (runs windeployqt → deployqt\ bundle)
        shell: pwsh
        run: cmake --install build --config $env:BUILD_TYPE

      - name: Show build artifacts
        shell: pwsh
        run: |
          Write-Host "--- qCC install contents ---"
          Get-ChildItem build/qCC/install -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Extension -in '.exe','.dll' } |
            Select-Object Name, @{N='MB';E={[math]::Round($_.Length/1MB,2)}} |
            Format-Table -AutoSize

      - name: Upload CloudCompare.exe
        uses: actions/upload-artifact@v4
        with:
          name: cloudcompare-windows-x64
          path: build/qCC/install/
          if-no-files-found: error
          retention-days: 14

      - name: Smoke test (CLI run, --version if available)
        shell: pwsh
        run: |
          $exe = "build/qCC/install/CloudCompare.exe"
          if (Test-Path $exe) {
            Write-Host "Binary present: $((Get-Item $exe).Length / 1MB) MB"
            # The Windows runner has no display, so we just verify the binary
            # loads (its DLL deps resolve) and the entry point exists.
            # The Qt-platform plugin must be on QT_QPA_PLATFORM_PLUGIN_PATH for any
            # instantiation — but version/help queries don't need a display.
            & $exe --help 2>&1 | Select-Object -First 10
            if ($LASTEXITCODE -ne 0) { Write-Host "Non-zero exit (no display on runner) — OK" }
          } else {
            Write-Error "CloudCompare.exe not found"
            exit 1
          }
