name: Deploy docs site to GitHub Pages

# Publishes the Docusaurus site under `website/` to GitHub Pages on every
# push to `master` that touches the site or this workflow file. Also
# manually triggerable from the Actions tab.
#
# The live site lands at https://bramburn.github.io/CloudCompare/ once
# GitHub Pages is configured to "Source: GitHub Actions" in
# Settings > Pages.
#
# To switch to a custom domain:
#   1. Add a static/CNAME file (e.g. `docs.bramburn.dev`).
#   2. Add a CNAME record from that domain to `bramburn.github.io`.
#   3. Re-run this workflow.

on:
  push:
    branches: [master]
    paths:
      - 'website/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

# Allow this workflow to:
#   - read repo contents
#   - write to GitHub Pages
#   - mint an OIDC token (for the deploy-pages action)
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time. Newer runs wait for the older one to
# finish; we never cancel an in-flight deploy because partial gh-pages
# branches can be a mess to recover from.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Docusaurus site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so Docusaurus's "last updated" timestamps resolve.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: website

      - name: Build the site
        run: npm run build
        working-directory: website

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/build

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
