[package]
name = "cc_rust"
version = "0.1.0"
edition = "2021"
authors = ["bramburn <noreply@example.com>"]
# Marking the package with a `links` key (any string) causes cargo
# to propagate `rustc-link-*` directives from the build script to
# ALL targets (lib, bin, test, example, bench) — without this, on
# some cargo versions the test target silently drops the
# `-l static=cc_rust_ffi` / `-l CCCoreLib` flags and the test
# binary crashes at startup with STATUS_DLL_NOT_FOUND.
links = "cc_rust_ffi"
description = "Rust migration of CCCoreLib compute kernels. Lives alongside CloudCompare's C++ build, linked via CXX FFI."

[lib]
name = "cc_rust"
path = "src/lib.rs"
# Both staticlib (for C++ GUI to link) and rlib (for Rust binaries in
# the same crate to use directly).
crate-type = ["staticlib", "rlib"]

[[bin]]
name = "cc_rust_cli"
path = "src/main.rs"

# ── CXX FFI (disabled until CCCoreLib is configured for sandbox) ─────
# Re-enable these when adding the CXX FFI layer to call into CCCoreLib
# (see ../experimental/sessions/2026-08-19-rust-migration-icp-scalarfield/CONFIGURE_CCCORELIB.md
#  and ../experimental/templates/rust_cxx_app/ for a working template).
[features]
default = []
cxx_ffi = ["dep:cxx", "dep:cxx-build"]
# Sentry crash reporting (mirrors the qCC CMake POST_BUILD opt-in).
# Same DSN as the main app (qCC/main.cpp) so crashes from Rust code
# land in the same Sentry project as C++ crashes. Set CC_SENTRY_DSN
# in the env to override (e.g. for dev/staging).
sentry = ["dep:sentry"]

[dependencies]
# Numerics
rayon = "1.10"
nalgebra = { version = "0.34", features = ["serde-serialize"] }
glam = "0.29"
smallvec = "1.13"
# num-traits for IEEE helpers (NAN, etc.)
num-traits = "0.2"

# Error handling + logging
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
log = "0.4"

# Sentry (optional, same DSN as the main app)
sentry = { version = "0.32", optional = true }

# CLI + serialisation
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# CXX (FFI; opt-in)
cxx = { version = "1.0", optional = true }

[build-dependencies]
cxx-build = { version = "1.0", optional = true }

# Testing + benchmarks
[dev-dependencies]
approx = "0.5"
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.4"

[[bench]]
name = "scalar_field_bench"
harness = false

[[bench]]
name = "icp_bench"
harness = false

# Windows-specific
[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["errhandlingapi", "handleapi", "debugapi"] }

[profile.release]
# opt-level=3 (max), thin LTO, single codegen unit, panic=abort.
#
# PGO (profile-guided optimisation) would give an extra 5-15%
# but is unavailable on the MSVC rustc shipped with this repo
# (`profiler_builtins` is not in the standard distribution —
# see pgo-build.sh). We tried `lto = "fat"` + `opt-level = 3`
# in place of thin LTO; on the 7.5M brook-avenue benchmark
# the wall time went from 244.15s (thin LTO) to 254.11s (fat
# LTO), so fat LTO is actually slightly slower than thin on
# this workload — likely because kiddo's hot path is a tight
# numeric kernel where the codegen unit boundary doesn't
# matter much. We keep thin LTO.
#
# If/when a custom rustc with profiler_builtins becomes
# available, the PGO workflow is `bash pgo-build.sh test` —
# see pgo-build.sh.
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1
