[package]
name = "rust_lib_template"
version = "0.1.0"
edition = "2021"
authors = ["bramburn <noreply@example.com>"]
description = "Template: pure-Rust library, no FFI, no GUI."

[lib]
name = "rust_lib_template"
path = "src/lib.rs"

[dependencies]
# Logging — wired in main, used in src/lib.rs
log = "0.4"
env_logger = "0.11"

# Error reporting — for Sentry (optional, gated by feature)
sentry = { version = "0.32", optional = true }

[features]
default = []
sentry = ["dep:sentry"]

[dev-dependencies]
# For tests
approx = "0.5"

[[bin]]
name = "demo_cli"
path = "examples/demo_cli.rs"

[profile.release]
opt-level = 3
lto = "thin"
