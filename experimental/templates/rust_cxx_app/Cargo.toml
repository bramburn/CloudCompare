[package]
name = "rust_cxx_app_template"
version = "0.1.0"
edition = "2021"
authors = ["bramburn <noreply@example.com>"]
description = "Template: Rust + CXX FFI. Rust calls C++ or vice versa."

[lib]
name = "rust_cxx_app_template"
path = "src/lib.rs"
# Both staticlib (for C++ GUI to link) and rlib (for Rust binaries in the
# same crate to use directly). Without "rlib" the bin target can't import
# the library.
crate-type = ["staticlib", "rlib"]

[[bin]]
name = "demo_cli"
path = "src/main.rs"

[features]
# Default: pure-Rust, no C++ needed. `cargo test` works out of the box.
# `cargo build --features cxx-ffi` enables the CXX bridge (requires the
# MSVC toolchain on Windows).
default = []
cxx-ffi = ["dep:cxx"]

[dependencies]
# CXX — the FFI bridge generator. See build.rs and src/lib.rs.
cxx = { version = "1.0", optional = true }
log = "0.4"
env_logger = "0.11"

[build-dependencies]
cxx-build = { version = "1.0", optional = true }

[dev-dependencies]
# For tests
approx = "0.5"

[profile.release]
opt-level = 3
lto = "thin"
