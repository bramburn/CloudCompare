[package]
name = "scalarfield_v2_rayon"
version = "0.1.0"
edition = "2021"
description = "Phase 1 strategy 2: parallel ScalarField with rayon. par_iter + reduce."

[lib]
name = "scalarfield_v2_rayon"
path = "src/lib.rs"

[dependencies]
rayon = "1.10"
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
approx = "0.5"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "bench"
harness = false

[profile.release]
opt-level = 3
lto = "thin"
