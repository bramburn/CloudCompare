[package]
name = "scalarfield_v1_sequential"
version = "0.1.0"
edition = "2021"
description = "Phase 1 strategy 1: sequential single-threaded ScalarField. Baseline."

[lib]
name = "scalarfield_v1_sequential"
path = "src/lib.rs"

[dependencies]
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
approx = "0.5"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "bench"
harness = false

[profile.release]
opt-level = 3
lto = "thin"
