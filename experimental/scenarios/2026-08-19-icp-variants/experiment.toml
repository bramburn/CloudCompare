id = "2026-08-19-icp-variants"
question = "Which nearest-neighbour structure should support Rust ICP?"

# Lifecycle state. SUPERSEDED — the original "naive wins" claim was
# based on benchmarks run with a buggy ICP. Three bugs in the
# algorithm were fixed on 2026-08-19 (see D4 in
# experimental/docs/decisions.md); the variants need to be re-bench'd
# with the corrected ICP before a "selected" decision can be made.
status = "benchmarked"

owner = "rust-migration"

# Reference implementation we're matching.
reference = { cpp = "CCCoreLib/src/RegistrationTools.cpp" }

# Valid fixtures for this scenario. The asymmetric-9 fixture is the
# canonical non-degenerate test cloud; the cube-8 fixture is kept
# as a regression test for the degenerate-H handling.
fixtures = [
    "synthetic/asymmetric-9.toml",
    "synthetic/cube-8.toml",
    "real/brook-avenue-splice.toml",   # optional: missing → skipped
]

# Variants. Each is a sibling session folder name.
variants = [
    "01-naive-on2",
    "02-kiddo-kdtree",
    "03-handrolled-octree",
]

# Metrics the runner collects.
metrics = [
    "build_success",
    "test_success",
    "correctness_rmse",
    "runtime_ms",
    "peak_memory_mb",
    "point_count",
    "failure_mode",
]

# What the winner must demonstrate. The runner enforces each of
# these — a missing piece keeps the scenario at "benchmarked" rather
# than letting it advance to "selected".
promotion = { required = [
    "all_correctness_tests_pass_with_corrected_icp",
    "benchmark_results_recorded_in_results_json",
    "decisions_md_explains_why",
] }

tags = ["icp", "nearest-neighbour", "rust", "phase-2", "needs-rebench"]
