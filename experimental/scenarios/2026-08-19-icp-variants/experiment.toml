id = "2026-08-19-icp-variants"
question = "Which nearest-neighbour structure should support Rust ICP?"

# Lifecycle state. D8 (2026-08-20) added the `NearestNeighbour`
# trait + `icp_with_nn` entry point. All three variants implement
# the trait and the ICP loop is now genuinely NN-driven for each.
# The cross-variant comparison scenario
# `2026-08-20-icp-nn-comparison` picked the winner (kiddo) with
# evidence (43x faster than naive at 10k). This scenario is
# `selected`.
status = "selected"

owner = "rust-migration"

# Reference implementation we're matching.
reference = { cpp = "CCCoreLib/src/RegistrationTools.cpp" }

# Valid fixtures for this scenario. The asymmetric-9 fixture is the
# canonical non-degenerate test cloud; the cube-8 fixture is kept
# as a regression test for the degenerate-H handling.
fixtures = [
    "synthetic/asymmetric-9.toml",
    "synthetic/cube-8.toml",
    "real/brook-avenue-splice.toml",   # optional: missing → skipped
]

# Variants. Each is a sibling session folder name.
variants = [
    "01-naive-on2",
    "02-kiddo-kdtree",
    "03-handrolled-octree",
]

# Metrics the runner collects.
metrics = [
    "build_success",
    "test_success",
    "correctness_rms",
    "nn_query_us",
    "icp_wall_seconds",
    "iterations",
    "converged",
    "point_count",
    "failure_mode",
]

# What the winner must demonstrate. The runner enforces each of
# these.
promotion = { required = [
    "all_three_variants_agree_on_correctness",
    "nn_query_timings_recorded_for_at_least_3_sizes",
    "icp_wall_timings_recorded_for_at_least_3_sizes",
    "decisions_md_picks_a_winner_with_evidence",
] }

tags = ["icp", "nearest-neighbour", "rust", "phase-2", "d8", "selected"]
