[package]
name = "icp_v1_naive"
version = "0.1.0"
edition = "2021"
description = "ICP variant 1: naive O(n²) nearest-neighbour. Baseline."

[lib]
name = "icp_v1_naive"
path = "src/lib.rs"

[dependencies]
# Use the corrected ICP implementation from cc-rust. This variant
# only differs in *which nearest-neighbour* it plugs in — not in
# the surrounding ICP algorithm. As of 2026-08-19, the algorithm
# in cc-rust has been fixed (see D4 in experimental/docs/decisions.md
# and patterns P12, P13, P14).
cc_rust = { path = "../../../../cc-rust" }
nalgebra = "0.34"
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
approx = "0.5"

[[bin]]
name = "icp_bench"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "thin"
