[package]
name = "icp_v1_naive"
version = "0.1.0"
edition = "2021"
description = "ICP variant 1: naive O(n²) nearest-neighbour. Baseline."

[lib]
name = "icp_v1_naive"
path = "src/lib.rs"

[dependencies]
nalgebra = "0.34"
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
approx = "0.5"

[[bin]]
name = "icp_bench"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "thin"
