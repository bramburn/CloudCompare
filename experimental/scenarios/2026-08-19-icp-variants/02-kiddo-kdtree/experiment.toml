id = "02-kiddo-kdtree"
status = "unit-tested"
algorithm = "KD-tree via the `kiddo` 6.0 crate. Uses `EytzingerFlexPf` stem strategy and `VecOfArenas` leaf strategy (kiddo defaults). Item index in the tree is the input array index."
build_cmd = "cargo build --release"
test_cmd = "cargo test --release"
bench_cmd = "cargo run --release --bin icp_bench"
fixtures = ["synthetic/asymmetric-9.toml", "synthetic/cube-8.toml"]

# Per-variant notes
notes = "kiddo 6.0 has a different API from 3.x/4.x/5.x. The query method is now `tree.query(&point).nearest_one::<SquaredEuclidean>().execute()`. The tree type needs 6 generic parameters; see `examples/probe_kiddo.rs` for a minimal example."

# History
last_correctness_test = "2026-08-19"
last_benchmark = "2026-08-19"
correctness_status = "matches reference (asymmetric-9) within ε"
benchmark_status = "NN query 0.36 µs at 2k Gaussian, 0.39 µs at 10k — best of the 3 variants for the NN step alone. Full ICP wall time is similar to 01 and 03 because cc-rust's ICP signature does not yet accept a custom NN (D8 candidate)."

