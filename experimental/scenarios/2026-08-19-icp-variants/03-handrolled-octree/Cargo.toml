[package]
name = "icp_v3_octree"
version = "0.1.0"
edition = "2021"
description = "ICP variant 3: hand-rolled octree nearest-neighbour. O(n) build, O(log n) average query (with AABB pruning)."

[lib]
name = "icp_v3_octree"
path = "src/lib.rs"

[dependencies]
# Use the corrected ICP implementation from cc-rust. The scenario
# only compares the *nearest-neighbour* data structure, not the
# surrounding algorithm. See D4 in experimental/docs/decisions.md
# and patterns P12/P13/P14 for the bug history.
cc_rust = { path = "../../../../cc-rust" }
nalgebra = "0.34"
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
approx = "0.5"

[[bin]]
name = "icp_bench"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "thin"
