[package]
name = "d8_realdata_all_nns"
version = "0.1.0"
edition = "2021"
description = "D8 end-to-end: run icp_with_nn with each of the 3 NNs (naive, kiddo, octree) on the brook-avenue .las scan. Same data, same algorithm, different NN — compare wall time and correctness."

[[bin]]
name = "d8_realdata_all_nns"
path = "src/main.rs"

[dependencies]
# The cc-rust crate (post-D4 + D8 trait + icp_with_nn + icp_multi_resolution_with_nn).
cc_rust = { path = "../../../cc-rust" }
# The 3 ICP variants. Each one re-exports `build_nn(model) -> <variant NN>`
# and `icp_iterate(data, model, params)`. The latter calls
# `icp_with_nn` under the hood with the variant's NN, so this is a
# genuine end-to-end test of the D8 trait dispatch.
icp_v1_naive = { path = "../../scenarios/2026-08-19-icp-variants/01-naive-on2" }
icp_v2_kiddo = { path = "../../scenarios/2026-08-19-icp-variants/02-kiddo-kdtree" }
icp_v3_octree = { path = "../../scenarios/2026-08-19-icp-variants/03-handrolled-octree" }
# Pure-Rust .las reader (Phase 4 strategy).
las_v1_pure_rust = { path = "../../scenarios/2026-08-19-las-parsers/01-pure-rust-las" }
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
log = "0.4"
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
