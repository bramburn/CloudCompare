[package]
name = "cc-sandbox"
version = "0.1.0"
edition = "2021"

# Package name: cc-sandbox (hyphen) → crate name: cc_sandbox (underscore)
# Cargo infers the lib → binary link automatically.
[lib]
name = "cc_sandbox"
path = "src/lib.rs"

[[bin]]
name = "cc-sandbox"
path = "src/main.rs"

# ── FFI (CXX bridge — disabled until CCCoreLib is configured) ─────────────
# Re-enable these when adding the CXX FFI layer (see CONFIGURE_CCCORELIB.md):
# cxx = "1.0"

[dependencies]
# Numerics
rayon = "1.10"
nalgebra = "0.34"    # linear algebra: SVD, matrix ops
glam = "0.29"        # 3D vectors, transforms
smallvec = "1.13"    # stack-allocated small vectors

# Error handling + logging
thiserror = "1.0"    # ergonomic errors
tracing = "0.1"      # structured logging (drop-in for fmt::eprintln)
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
sentry = "0.32"     # crash reporting (same DSN as main app)

# CLI + data
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"          # CSV for characterisation output
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"   # JSON output for benchmarks

# Testing + benchmarks
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.4"     # property-based testing

[build-dependencies]
# CXX bridge — re-enable when adding CCCoreLib FFI:
# cxx-build = "1.0"

# Windows-specific
[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["errhandlingapi", "handleapi", "debugapi"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1

[[bench]]
name = "scalar_field_bench"
harness = false

[[bench]]
name = "icp_bench"
harness = false
